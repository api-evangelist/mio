aid: mio
name: Mio
description: >-
  Mio is a collaboration interoperability platform that connects the leading
  enterprise messaging tools so teams on different platforms can work together
  without switching apps. Positioned as Google's official interoperability
  partner, Mio provides API-based middleware that relays messages, files, and
  directory information between Google Chat, Microsoft Teams, Slack, and Zoom
  Team Chat. Its products include Chat Sync (cross-platform messaging), External
  Chat Sync (partner/federated collaboration), Directory Sync (bidirectional
  user directory synchronization), and File Sync (shared Google Drive and
  SharePoint links). Mio runs as native middleware built directly with the
  platform vendors, never persistently stores user messages or files, encrypts
  data in transit with TLS 1.2+ and at rest with AES-256, and holds SOC 2 Type
  II certification with GDPR and CCPA controls. Mio is sold as an enterprise
  offering rather than a self-serve public developer API; this profile captures
  its public web, security, and support surface.
